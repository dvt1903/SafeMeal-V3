name: SafeMeal V4 tests
on:
  push:
    paths: ['v4/**', '.github/workflows/safemeal-v4.yml']
  pull_request:
    paths: ['v4/**', '.github/workflows/safemeal-v4.yml']
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test v4/tests/*.test.mjs
