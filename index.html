defs['QR8bitByte']=function(module,require){
var QRMode = require('./QRMode');

function QR8bitByte(data) {
	this.mode = QRMode.MODE_8BIT_BYTE;
	this.data = data;
}

QR8bitByte.prototype = {

	getLength : function() {
		return this.data.length;
	},
	
	write : function(buffer) {
		for (var i = 0; i < this.data.length; i++) {
			// not JIS ...
			buffer.put(this.data.charCodeAt(i), 8);
		}
	}
};

module.exports = QR8bitByte;

};
defs['QRBitBuffer']=function(module,require){
function QRBitBuffer() {
	this.buffer = [];
	this.length = 0;
}

QRBitBuffer.prototype = {

	get : function(index) {
		var bufIndex = Math.floor(index / 8);
		return ( (this.buffer[bufIndex] >>> (7 - index % 8) ) & 1) == 1;
	},
	
	put : function(num, length) {
		for (var i = 0; i < length; i++) {
			this.putBit( ( (num >>> (length - i - 1) ) & 1) == 1);
		}
	},
	
	getLengthInBits : function() {
		return this.length;
	},
	
	putBit : function(bit) {
	
		var bufIndex = Math.floor(this.length / 8);
		if (this.buffer.length <= bufIndex) {
			this.buffer.push(0);
		}
	
		if (bit) {
			this.buffer[bufIndex] |= (0x80 >>> (this.length % 8) );
		}
	
		this.length++;
	}
};

module.exports = QRBitBuffer;

};

defs['QRMath']=function(module,require){
var QRMath = {

	glog : function(n) {
	
		if (n < 1) {
			throw new Error("glog(" + n + ")");
		}
		
		return QRMath.LOG_TABLE[n];
	},
	
	gexp : function(n) {
	
		while (n < 0) {
			n += 255;
		}
	
		while (n >= 256) {
			n -= 255;
		}
	
		return QRMath.EXP_TABLE[n];
	},
	
	EXP_TABLE : new Array(256),
	
	LOG_TABLE : new Array(256)

};
	
for (var i = 0; i < 8; i++) {
	QRMath.EXP_TABLE[i] = 1 << i;
}
for (var i = 8; i < 256; i++) {
	QRMath.EXP_TABLE[i] = QRMath.EXP_TABLE[i - 4]
		^ QRMath.EXP_TABLE[i - 5]
		^ QRMath.EXP_TABLE[i - 6]
		^ QRMath.EXP_TABLE[i - 8];

	QRMath.LOG_TABLE[QRMath.EXP_TABLE[i] ] = i;
}

defs['QRPolynomial']=function(module,require){
var QRMath = require('./QRMath');

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}
}

QRPolynomial.prototype = {

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}
};

module.exports = QRPolynomial;

};

	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

module.exports = QRCode;

function viewMeals(){shell(`${intro('TRUY XUẤT TỪ MẺ ĂN','Mẻ ăn & mã QR','Liên kết một hoặc nhiều lô nguyên liệu với mỗi mẻ chế biến.',button('＋ Tạo mẻ ăn','newmeal','','primary'))}<div class="meals">${s.meals.map(m=>`<div class="card meal"><div class="flex" style="justify-content:space-between"><span class="tag ${affected(m)?'pending':''}">${affected(m)?'⚠ Cần đối chiếu':'✓ Đã ghi hồ sơ'}</span><span class="mono">${m.id}</span></div><div class="emoji">${m.name.toLowerCase().includes('salad')?'🥗':'🍱'}</div><h3>${esc(m.name)}</h3><p>${money(m.servings)} suất · ${date(m.created)}</p><div class="source">${m.ingredients.map(i=>`<span>${i.lot} · ${money(i.amount)} ${esc(lot(i.lot)?.unit)}</span>`).join('')}</div><div class="flex">${button('▦ Mã QR','qr',m.id,'primary')}${button('Hồ sơ công bố ↗','public',m.id)}</div></div>`).join('')}</div><div class="callout warncall">Mã QR của bản offline chứa <b>mã tham chiếu mẻ</b>, không phải URL máy chủ công khai. Nút “Hồ sơ công bố” mở trực tiếp trong ứng dụng; muốn quét trên điện thoại và truy cập trang web phải dùng bản có máy chủ.</div>`)}
function viewAlerts(){let flagged=s.lots.filter(l=>warn(l.id)||l.status!=='active');shell(`${intro('PHÁT HIỆN VÀ PHẢN ỨNG','Trung tâm kiểm định','Cảnh báo chỉ để xem xét, không tự động khẳng định chất lượng thực phẩm.')}<div class="mini-grid" style="margin-bottom:18px">${stat('Lô có cảnh báo',flagged.length,'Giả lập dựa trên ngưỡng','⚠️')}${stat('Lô tạm giữ',s.lots.filter(l=>l.status==='held').length,'Không tiếp nhận thêm','⏸️')}${stat('Lô bị thu hồi',s.lots.filter(l=>l.status==='recalled').length,'Cần xử lý thực tế','🚨')}</div>${flagged.length?flagged.map(l=>`<div class="card alert"><div class="round">⚠</div><div class="grow"><div class="flex"><span class="mono">${l.id}</span>${status(l.status)}</div><h3>${esc(l.product)}</h3><p>${warn(l.id)?`Nhiệt độ lớn nhất <b>${maxTemp(l.id)}°C</b> vượt ngưỡng ${l.threshold}°C (dữ liệu cảm biến giả lập).`: 'Lô có trạng thái kiểm định cần chú ý.'} Đã sử dụng cho <b>${used(l.id).length}</b> mẻ ăn: ${used(l.id).map(m=>m.id).join(', ')||'chưa có'}.</p><div class="flex">${button('Chi tiết & truy vết','lot',l.id)}${l.status==='active'?button('Tạm giữ','hold',l.id,'warn',may('inspector')?'':'disabled'):''}${l.status!=='recalled'?button('Thu hồi','recall',l.id,'danger',may('inspector')?'':'disabled'):''}${l.status==='held'?button('Bỏ phiếu gỡ giữ 2/3','vote',l.id,'outline',['supplier_a','canteen','inspector'].includes(actorId)?'':'disabled'):''}</div></div></div>`).join(''):'<div class="card panel">Chưa có cảnh báo trong dữ liệu hiện tại.</div>'}<div class="callout">🔍 Tình huống mẫu: <b>L001</b> (9,6°C) xuất hiện trong <b>M01 và M02</b>. Chọn vai trò <b>Ban kiểm định</b>, tạm giữ L001 rồi mở công bố M01 và M02 để thấy cảnh báo lan truyền.</div>`)}
function docHash(d){if(d.content.startsWith('BASE64:')){try{return shaBytes(Uint8Array.from(atob(d.content.slice(7)),c=>c.charCodeAt(0)))}catch(e){return hash(d.content)}}return hash(d.content)}
function viewDocs(){shell(`${intro('CHỨNG TỪ VÀ TÍNH TOÀN VẸN','Hồ sơ & SHA-256','So sánh nội dung tài liệu với dấu vân tay đã ghi từ trước.',button('＋ Thêm chứng từ','newdoc','','primary'))}${table(['Tài liệu','Mã lô','SHA-256 đã ghi','Đối chiếu','Hành động'],s.docs.map(d=>`<tr><td><b>${esc(d.name)}</b><span class="sub">${date(d.created)}</span></td><td>${d.lot?`<span class="mono">${esc(d.lot)}</span>`:'<span class="tag blue">MANIFEST</span>'}</td><td><code class="mono">${fmtHash(d.sha)}</code></td><td>${docHash(d)===d.sha?'<span class="tag">✓ Trùng khớp</span>':'<span class="tag bad">✕ Bị sửa đổi</span>'}</td><td><div class="flex">${button('Kiểm tra','doc',d.id)}${button('Tải xuống','downloadDoc',d.id)}${d.lot?button('Giả lập sửa','tamper',d.id,'warn',may('inspector')?'':'disabled'):''}</div></td></tr>`).join(''))}<div class="callout">🛡️ SHA-256 kiểm tra sự trùng khớp byte, <b>không chứng minh dữ liệu ban đầu là sự thật</b>. Dữ liệu và hash ở đây cùng lưu trên trình duyệt; chưa neo hash lên một Blockchain độc lập.</div>`)}
const labelEvent=x=>({LOT_CREATED:'Tạo lô',TRANSFER_REQUESTED:'Đề nghị bàn giao',TRANSFER_ACCEPTED:'Đã nhận hàng',SENSOR_SUMMARY:'Dữ liệu cảm biến mẫu',SENSOR_READING:'Đo nhiệt độ',MEAL_CREATED:'Tạo mẻ ăn',LOT_HELD:'Tạm giữ',LOT_RECALLED:'Thu hồi',RELEASE_APPROVED:'Phiếu phê duyệt',LOT_RELEASED:'Gỡ tạm giữ',EVIDENCE_ADDED:'Bổ sung chứng từ'})[x]||x;
function verifyChain(){let prev='0'.repeat(64);for(const e of s.events){let v={seq:e.seq,type:e.type,entity:e.entity,actor:e.actor,payload:e.payload,prev:e.prev,time:e.time};if(e.prev!==prev||hash(JSON.stringify(v))!==e.digest)return {ok:false,index:e.seq};prev=e.digest}return {ok:true,count:s.events.length,head:prev}}
function viewLedger(){let v=verifyChain();shell(`${intro('LỊCH SỬ KHÔNG GHI ĐÈ','Nhật ký xác nhận','Dấu SHA-256 nối từng sự kiện với sự kiện trước (sổ ghi cục bộ).',button('🛡 Kiểm tra chuỗi hash','verifychain','','primary'))}<div class="callout ${v.ok?'':'warncall'}">${v.ok?'✓ Chuỗi hash cục bộ khớp '+v.count+' sự kiện.':'⚠ Nhật ký đã bị sửa tại sự kiện #'+v.index} Đây không phải giao dịch blockchain, không đảm bảo chống lại người quản trị có thể tính lại sổ.</div>${table(['STT','Sự kiện','Đối tượng','Người thao tác','Thời gian','Hash sự kiện'],s.events.slice().reverse().map(e=>`<tr><td class="mono">#${e.seq}</td><td><b>${esc(labelEvent(e.type))}</b></td><td class="mono">${esc(e.entity)}</td><td>${esc(name(e.actor))}</td><td>${date(e.time)}</td><td><span class="mono" title="${e.digest}">${fmtHash(e.digest)}</span></td></tr>`).join(''))}`)}
function render(){if(publicMealId){renderPublic(publicMealId);return}const fn={quality:v2ViewPipeline,complaints:v2ViewComplaints,security:v2ViewSecurity,overview:viewOverview,lots:viewLots,transfers:viewTransfers,meals:viewMeals,alerts:viewAlerts,docs:viewDocs,ledger:viewLedger}[page]||viewOverview;fn()}
function modal(title,subtitle,body,w=false){$('#overlay').innerHTML=`<div class="modalbg" id="modalbg"><div class="modal ${w?'wide':''}" role="dialog" aria-modal="true"><div class="modalhead"><div><div class="eyebrow">SAFEMEAL • THAO TÁC DEMO</div><h2>${esc(title)}</h2><p>${esc(subtitle)}</p></div><button data-action="close" class="close" title="Đóng">×</button></div><div class="modalbody">${body}</div></div></div>`}
function foot(submit='Lưu dữ liệu'){return `<div class="modalfooter">${button('Huỷ','close') }<button type="submit" class="btn primary">✓ ${submit}</button></div>`}
function field(n,label,type='text',val='',extra=''){return `<div class="field"><label for="f-${n}">${label}</label><input class="input" id="f-${n}" name="${n}" type="${type}" value="${esc(val)}" ${extra} required></div>`}
function options(data,selected=''){return data.map(([v,t])=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(t)}</option>`).join('')}
function optField(name,label,opts,required=true){return `<div class="field"><label for="f-${name}">${label}</label><select class="input" id="f-${name}" name="${name}" ${required?'required':''}>${opts}</select></div>`}
function openNewLot(){if(!may('supplier'))return toast('Hãy đổi sang vai trò nhà cung cấp để tạo lô.',true);modal('Tạo lô nguyên liệu mới','Dữ liệu được lưu trong trình duyệt hiện tại.',`<form id="form-lot"><div class="fields">${field('product','Tên nguyên liệu','text','','minlength="2" maxlength="120"')}${field('origin','Nơi xuất xứ')}${field('quantity','Số lượng nhập','number','50','min="0.01" step="0.01"')}${optField('unit','Đơn vị',options([['kg','kg'],['lít','lít'],['thùng','thùng']]))}${field('threshold','Giới hạn nhiệt độ (°C)','number','8','min="-40" max="50" step="0.1"')}</div>${foot('Tạo lô')}</form>`)}
function openNewMeal(){if(!may('canteen'))return toast('Chỉ vai trò căng tin mới tạo được mẻ ăn.',true);let avail=s.lots.filter(l=>tr(l.id)?.status==='accepted'&&l.remaining>0&&l.status==='active');if(!avail.length)return toast('Không có lô đã nhận, đang hoạt động và còn hàng.',true);const opts=options(avail.map(l=>[l.id,`${l.id} — ${l.product} (${money(l.remaining)} ${l.unit})`]));modal('Tạo mẻ ăn mới','Mẻ ăn có thể lấy từ 1 hoặc 2 lô nguyên liệu đã bàn giao.',`<form id="form-meal"><div class="fields">${field('name','Tên mẻ ăn')}${field('servings','Số suất ăn','number','50','min="1" step="1"')}${optField('lot1','Lô nguyên liệu thứ nhất',opts)}${field('amount1','Lượng sử dụng lô 1','number','3','min="0.01" step="0.01"')}<div class="field"><label for="f-lot2">Lô nguyên liệu thứ hai (không bắt buộc)</label><select class="input" name="lot2" id="f-lot2"><option value="">Không chọn</option>${opts}</select></div><div class="field"><label for="f-amount2">Lượng sử dụng lô 2</label><input class="input" type="number" name="amount2" id="f-amount2" min="0" step="0.01" placeholder="Chỉ nhập nếu chọn lô 2"></div></div>${foot('Tạo mẻ ăn & manifest')}</form>`)}
function openNewDoc(){if(!may('supplier'))return toast('Chuyển sang vai trò nhà cung cấp để tải chứng từ.',true);const ls=s.lots.filter(l=>l.supplier===actorId&&l.status==='active');modal('Thêm chứng từ','Tệp nhỏ được lưu trong bộ nhớ trình duyệt và băm SHA-256.',`<form id="form-doc">${optField('lot','Lô nguyên liệu',options(ls.map(l=>[l.id,`${l.id} — ${l.product}`])))}<div class="field"><label for="f-file">Chọn tệp (tối đa 200 KB)</label><input type="file" name="file" id="f-file" class="input" required></div>${foot('Lưu & băm chứng từ')}</form>`)}
function viewLot(id){const l=lot(id);if(!l)return toast('Không tìm thấy lô.',true);let t=tr(id),v=meas(id),docs=s.docs.filter(d=>d.lot===id);modal(`Chi tiết lô ${id}`,l.product,`<div class="details"><div><label>Xuất xứ</label><strong>${esc(l.origin)}</strong></div><div><label>Nhà cung cấp</label><strong>${esc(name(l.supplier))}</strong></div><div><label>Tồn kho</label><strong>${money(l.remaining)} / ${money(l.quantity)} ${esc(l.unit)}</strong></div><div><label>Trạng thái</label><strong>${status(l.status)}</strong></div><div><label>Bàn giao</label><strong>${t?status(t.status):'<span class="tag pending">Chưa lập đề nghị</span>'}</strong></div><div><label>Nhiệt cao nhất / ngưỡng</label><strong>${v.length?maxTemp(id)+'°C / '+l.threshold+'°C':'Không có số đo'}</strong></div></div><div class="sectionbar"><h2>Mẻ ăn có liên quan</h2></div>${used(id).length?used(id).map(m=>`<div class="flowline"><div class="round">🍱</div><div class="grow"><b>${m.id} · ${esc(m.name)}</b><p>Đã dùng ${money(m.ingredients.find(i=>i.lot===id).amount)} ${l.unit}</p></div>${button('Xem công bố','public',m.id)}</div>`).join(''):'<p class="note">Chưa dùng cho mẻ ăn nào.</p>'}<div class="sectionbar"><h2>Chứng từ liên quan</h2></div>${docs.map(d=>`<p style="font-size:12px">◈ ${esc(d.name)} <span class="mono">${fmtHash(d.sha)}</span> ${button('Kiểm tra','doc',d.id)}</p>`).join('')}<div class="sectionbar"><h2>Thao tác theo vai trò</h2></div><div class="flex">${!t&&l.status==='active'&&l.supplier===actorId?button('Tạo đề nghị bàn giao','request',id,'primary'):''}${may('carrier')?button('＋ Ghi đo cảm biến giả lập','newreading',id):''}${button('Xuất gói bằng chứng JSON','export',id)}${button('Xem kiểm định 3 bước','goto','quality')} ${s.packages.find(p=>p.lot===id)?button('Xem 1 mã kiểm định tổng hợp','v2tag',s.packages.find(p=>p.lot===id).code):''}</div><p class="note">Dữ liệu đo và danh tính trong bản HTML là mô phỏng. Nút xuất bằng chứng tạo tệp JSON để xem được mà không có máy chủ.</p>`,true)}
function viewDoc(id){const d=s.docs.find(x=>x.id===+id);if(!d)return toast('Không tìm thấy tài liệu',true);const result=docHash(d),ok=result===d.sha;modal(`Đối chiếu chứng từ #${id}`,d.name,`<div class="callout ${ok?'':'warncall'}">${ok?'✓ TÀI LIỆU CHƯA BỊ THAY ĐỔI':'✕ PHÁT HIỆN NỘI DUNG KHÔNG KHỚP'}</div><div class="details"><div><label>SHA-256 ban đầu</label><strong class="mono">${d.sha}</strong></div><div><label>SHA-256 tính lại</label><strong class="mono" style="color:${ok?'#19845c':'#c33d3d'}">${result}</strong></div></div><div class="flex" style="margin-top:16px">${d.tampered?button('Khôi phục chứng từ','restore',id,'primary',may('inspector')?'':'disabled'):''}${button('Tải chứng từ hiện tại','downloadDoc',id)}</div>`)}
function qrSvg(textValue){if(typeof SafeQR==='undefined')return `<p>Không thể tải bộ tạo QR nội bộ.</p>`;const qr=new SafeQR(-1,SafeQRLevel.M);qr.addData(textValue);qr.make();const n=qr.getModuleCount(),step=5,m=3,size=(n+m*2)*step;let rects=`<rect width="${size}" height="${size}" fill="white"/>`;for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(qr.isDark(y,x))rects+=`<rect x="${(x+m)*step}" y="${(y+m)*step}" width="${step}" height="${step}" fill="#133e33"/>`;return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" width="225" height="225" role="img" aria-label="QR của mẻ ${esc(textValue)}">${rects}</svg>`}
function viewQr(id){const m=s.meals.find(m=>m.id===id);if(!m)return;modal(`Mã QR – ${id}`,m.name,`<div style="text-align:center"><div class="qrbox">${qrSvg('SAFEMEAL-DEMO:'+id)}</div><p><b>${id} · ${esc(m.name)}</b></p><p class="note">QR này mã hóa <b>SAFEMEAL-DEMO:${id}</b>; quét bằng điện thoại cho ra mã tham chiếu, không mở trang trực tuyến. Bấm bên dưới để xem trang công bố trong bản offline.</p><div class="flex" style="justify-content:center">${button('Xem trang công bố →','public',id,'primary')}${button('Đóng','close')}</div></div>`)}
function renderPublic(id){const m=s.meals.find(m=>m.id===id);if(!m){$('#app').innerHTML=`<div class="public"><h1>Không tìm thấy mẻ ăn ${esc(id)}</h1>${button('Về ứng dụng','gohome')}</div>`;return}const hasIssues=affected(m);$('#app').innerHTML=`<div class="public"><div class="publicheader"><div class="brand" style="padding:0"><div class="logo">✦</div><div><strong style="color:#0d543b">SafeMeal</strong><small style="color:#6f9685">HỒ SƠ CÔNG BỐ</small></div></div>${button('← Về bảng điều khiển','gohome','','outline')}</div><section class="card publiccard"><div class="eyebrow">TRA CỨU NGUỒN GỐC MẺ ĂN</div><h1 style="color:#154b37">${esc(m.name)}</h1><p style="color:#799287">Mã mẻ: ${m.id} · ${money(m.servings)} suất · ${date(m.created)}</p><div class="callout ${hasIssues?'warncall':''}">${hasIssues?'⚠ Một hoặc nhiều nguyên liệu có cảnh báo nhiệt độ hoặc trạng thái kiểm định. Hồ sơ cần xem xét thêm.':'✓ Đã ghi nhận liên kết nguyên liệu trong bản demo. Không có cảnh báo ở thời điểm xem.'}</div><div class="sectionbar"><h2>Nguồn gốc nguyên liệu</h2></div>${m.ingredients.map(i=>{let l=lot(i.lot),t=tr(i.lot);return `<div class="flowline"><div class="round">🥬</div><div class="grow"><b>${esc(l.product)} — ${i.lot}</b><p>Xuất xứ: ${esc(l.origin)} • Nhà cung cấp: ${esc(name(l.supplier))}<br>Lượng sử dụng: ${money(i.amount)} ${l.unit}; ${t?.status==='accepted'?'Đã ghi nhận bên nhận hàng':'Thiếu xác nhận bàn giao'}</p></div>${status(l.status)}</div>`}).join('')}<div class="sectionbar"><h2>Kiểm định 3 bước → 1 mã tổng hợp cho mỗi lô</h2></div>${m.ingredients.map(i=>{const p=s.packages.find(x=>x.lot===i.lot);return `<div class="flowline"><div class="grow"><b>${esc(i.lot)}</b> ${v2TraceStatus(i.lot)}<p class="mono">${p?esc(p.code):'Chưa cấp mã'}</p></div>${p?button('Xem QR/mã','v2tag',p.code):''}</div>`}).join('')}<div class="sectionbar"><h2>Thông tin kiểm chứng</h2></div><div class="details"><div><label>Mã mẻ</label><strong>${m.id}</strong></div><div><label>Nguồn dữ liệu</label><strong>Chứng từ và vai trò giả lập</strong></div><div style="grid-column:1/-1"><label>SHA-256 Manifest</label><strong class="mono">${m.manifest}</strong></div></div><div class="callout warncall">Đây là hồ sơ của <b>bản demo offline</b>. Chưa có xác nhận Blockchain, kiểm định thực tế hoặc chữ ký số từ cơ quan có thẩm quyền.</div></section><p class="footer">SafeMeal demo • Đoàn Văn Tâm • MSSV 20010921</p></div>`}
function toast(msg,error=false){const o=$('#toast');o.innerHTML=`<div class="toast ${error?'err':''}">${esc(msg)}</div>`;setTimeout(()=>{if(o)o.innerHTML=''},3700)}
function downloadFile(filename,content,type='application/json'){const a=document.createElement('a'),blob=new Blob([content],{type});const url=URL.createObjectURL(blob);a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}

/* SafeMeal V3 — 3-stage point-of-sale inspection and unified certificate. Bundled inline into standalone HTML by tao_ban_chay.py.
   The Web3 blockchain interface in this version is SIMULATED, but WebCrypto encryption is REAL. */
const STAGE_NAMES=['','Kiểm định vùng trồng / đầu nguồn','Kiểm định cơ sở sản xuất / đóng gói','Kiểm định tại điểm bán'];
const STAGE_ROLES=['','supplier','processor','canteen'];
const STAGE_SYMBOLS=['','🌱','🏭','🏪'];
function v2Stages(id){return [1,2,3].map(step=>[...(s.stages||[])].reverse().find(x=>x.lot===id&&x.step===step)||null)}
function v2Approved(id,step=3){return v2Stages(id).slice(0,step).every(x=>x&&x.result==='pass'&&x.digest===hash(JSON.stringify({lot:x.lot,step:x.step,actor:x.actor,meta:x.meta,result:x.result,time:x.time})))}
function v2SeedRecord(id,step,result,actor,meta){const x={id:`ST-${s.stages.length+1}`,lot:id,step,result,actor,time:ts(),meta};x.digest=hash(JSON.stringify({lot:x.lot,step:x.step,actor:x.actor,meta:x.meta,result:x.result,time:x.time}));s.stages.push(x);entry(s,'QUALITY_STEP',id,actor,{step,result,recordHash:x.digest,simulated:true});return x}
// Một mã kiểm định tổng hợp cho mỗi lô; liên kết ba dấu SHA-256 của ba phiếu và phiếu bàn giao.
function v3Canonical(id){
 const t=tr(id), st=v2Stages(id);
 if(!v2Approved(id)||!t||t.status!=='accepted'||!t.accepted)return null;
 return {schema:'SafeMeal-Unified-Inspection-v1',lot:id,stepHashes:st.map(x=>x.digest),handover:{id:t.id,from:t.from,to:t.to,accepted:t.accepted}};
}
function v3CodeFor(id){const payload=v3Canonical(id);if(!payload)return null;const combinedHash=hash(JSON.stringify(payload));return {code:'SMKD-'+id+'-'+combinedHash.slice(0,12).toUpperCase(),combinedHash,payload}}
function v3CodeStatus(p){
 if(!p||!lot(p.lot))return {valid:false,why:'Không có lô tương ứng'};
 const now=v3CodeFor(p.lot);
 if(!now)return {valid:false,why:'Hồ sơ một trong ba bước hoặc bàn giao hiện không hợp lệ'};
 if(p.code!==now.code||p.combinedHash!==now.combinedHash||p.integrity!==hash(p.code+'|'+p.combinedHash))return {valid:false,why:'Mã tổng hợp / SHA-256 không khớp ba bước hiện tại'};
 return {valid:true,why:'Ba bước, phiếu bàn giao và mã tổng hợp cùng khớp'};
}
function v3IssueCode(id,who,fromSeed=false){
 if(s.packages.some(p=>p.lot===id))throw Error('Mỗi lô chỉ được cấp một mã kiểm định tổng hợp.');
 const c=v3CodeFor(id);if(!c)throw Error('Cần hoàn thành ba bước và có bàn giao đã xác nhận trước khi cấp mã.');
 const p={code:c.code,lot:id,created:ts(),stepDigests:c.payload.stepHashes,combinedHash:c.combinedHash,integrity:hash(c.code+'|'+c.combinedHash),sample:fromSeed};
 s.packages.push(p);
 entry(s,'UNIFIED_INSPECTION_CODE_ISSUED',id,who,{codeHash:hash(p.code),combinedHash:p.combinedHash,stepDigests:p.stepDigests,simulated:true});
 return p;
}

function v2Init(){

 if(s.v2Version===3&&Array.isArray(s.stages)&&Array.isArray(s.packages)&&Array.isArray(s.complaints)&&Array.isArray(s.secureDocs))return;
 const fromOld=Array.isArray(s.stages)&&s.stages.length>0;
 s.stages=s.stages||[];s.packages=s.packages||[];s.complaints=s.complaints||[];s.secureDocs=s.secureDocs||[];
 const src={L001:['Đà Lạt - nông trại An Phúc','2026-10-01','Nhật ký trồng và thu hoạch DEMO'],L002:['Đồng Nai - trang trại Bình Minh','2026-10-01','Nhật ký chăn nuôi DEMO'],L003:['Đơn Dương - nông trại An Phúc','2026-10-02','Nhật ký canh tác DEMO'],L004:['Củ Chi - trang trại Bình Minh','2026-10-01','Nhật ký đầu nguồn DEMO']};
 const factory={L001:['Xưởng GreenFood','2026-10-02','2026-10-18'],L002:['Xưởng GreenFood','2026-10-02','2026-10-16'],L004:['Xưởng GreenFood','2026-10-02','2026-10-24']};
 for(const l of s.lots){
  if(!v2Stages(l.id)[0])v2SeedRecord(l.id,1,'pass',l.supplier,{location:src[l.id]?.[0]||l.origin,date:src[l.id]?.[1]||'2026-10-02',reference:src[l.id]?.[2]||'Mẫu hồ sơ đầu nguồn (giả lập)'});
  if(factory[l.id]&&!v2Stages(l.id)[1])v2SeedRecord(l.id,2,'pass','processor',{location:factory[l.id][0],date:factory[l.id][1],expiry:factory[l.id][2],reference:'Phiếu sản xuất / đóng gói DEMO'});
  if(['L001','L002'].includes(l.id)&&!v2Stages(l.id)[2])v2SeedRecord(l.id,3,'pass','canteen',{location:'Quầy nhận hàng – Căng tin Đại học',date:'2026-10-03',reference:'Phiếu kiểm định tại điểm bán (giả lập)',seal:'intact',displayTemp:'4'});
 }
 // Nâng cấp từ V2: mã tem phát ở bước 2 không còn hiệu lực; chuyển sang DUY NHẤT một mã sau bước 3.
 // Các phiếu cũ không được âm thầm đổi người ký, nên bước 3 V2 ghi bởi inspector cần làm lại tại điểm bán.
 if(fromOld&&s.v2Version===2){
  s.stages=s.stages.filter(x=>x.step!==3||x.actor==='canteen');
  entry(s,'QUALITY_POLICY_UPDATED','SYSTEM','demo',{message:'Bước 3 thay bằng kiểm định tại điểm bán. Tem V2 được thay thế bởi mã tổng hợp V3.'});
 }
 s.packages=[];
 for(const l of s.lots)if(v3CodeFor(l.id))v3IssueCode(l.id,'canteen',true);
 s.v2Version=3;save();
}
function v2StepLabel(r){return !r?'<span class="tag pending">Chưa thực hiện</span>':r.result==='pass'?'<span class="tag">Đã ghi đạt (mô phỏng)</span>':r.result==='fail'?'<span class="tag bad">Không đạt</span>':'<span class="tag pending">Chờ bổ sung</span>'}
function v2TraceStatus(id){
 const arr=v2Stages(id),num=arr.filter(x=>x?.result==='pass').length;
 const p=s.packages.find(x=>x.lot===id),valid=p&&v3CodeStatus(p).valid;
 return `<span class="tag ${num===3?'':'pending'}">${num}/3 bước</span> ${valid?'<span class="tag">Đã cấp 1 mã tổng hợp</span>':'<span class="tag pending">Chưa có mã tổng hợp hợp lệ</span>'}`;
}
function v2RecordStatus(id){let x=v2Stages(id);return x.map((r,i)=>`<div class="flowline"><div class="round">${STAGE_SYMBOLS[i+1]}</div><div class="grow"><b>Bước ${i+1}: ${STAGE_NAMES[i+1]}</b><p>${r?'Người ghi: '+esc(name(r.actor))+' · '+date(r.time)+'<br>SHA-256: '+esc(fmtHash(r.digest)):'Chưa có phiếu xác nhận'}</p></div>${v2StepLabel(r)}${r?button('Xem phiếu','v2detail',r.id):''}</div>`).join('')}
function v2ViewPipeline(){

async function v2CameraScan(){if(!('BarcodeDetector' in window)||!navigator.mediaDevices?.getUserMedia)throw Error('Chrome/Edge hiện tại không hỗ trợ quét QR bằng camera. Hãy nhập mã tem thủ công.');

 try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});v2ScanStream=stream;v2ScanActive=true;const video=byId('v2-camera');if(!video){v2StopCamera();return}video.srcObject=stream;await video.play();const detector=new BarcodeDetector({formats:['qr_code']});

function v2ViewSecurity(){const secureOk=Boolean(globalThis.crypto?.subtle);shell(`${intro('GIẢI THÍCH VÀ TRÌNH DIỄN MÃ HÓA','Bảo mật AES-256-GCM','Dùng Web Crypto API của trình duyệt để mã hóa thật; có thể thử mật khẩu đúng/sai.')}
 <div class="v2-tech"><div class="card v2-techitem"><b>🔐 AES-256-GCM</b><p>Giấu nội dung chứng từ nội bộ, kiểm tra tag xác thực. Mã hóa bằng khóa suy ra từ mật khẩu PBKDF2.</p></div><div class="card v2-techitem"><b>🧬 SHA-256</b><p>Dấu vân tay chứng từ, phiếu kiểm định và nhật ký. <b>Không giấu nội dung!</b></p></div><div class="card v2-techitem"><b>✍️ Chữ ký số / Blockchain</b><p>Chưa có chữ ký tổ chức hoặc đồng thuận đa bên trong bản offline này. Đây là mục mở rộng.</p></div></div>
 ${secureOk?`<div class="card panel" style="margin:22px 0"><div class="eyebrow">THỬ NGAY — MÃ HÓA THẬT</div><h2>Tạo ghi chú kiểm định được mã hóa</h2><form id="form-v2-secret"><div class="fields">${optField('lot','Gắn ghi chú với lô',options(s.lots.map(l=>[l.id,l.id+' — '+l.product])))}${field('title','Tiêu đề ghi chú','text','Phiếu kiểm tra nội bộ')}</div><div class="field"><label>Thông tin mật cần mã hóa (chỉ lưu ciphertext)</label><textarea class="input" name="plaintext" required minlength="5" rows="3" placeholder="Ví dụ: nhận định kiểm tra mẫu nội bộ..."></textarea></div><div class="field"><label>Mật khẩu giải mã tự đặt (từ 8 ký tự)</label><input class="input" type="password" name="password" minlength="8" required autocomplete="new-password"></div><button class="btn primary" type="submit">🔒 Mã hóa AES-256-GCM và lưu</button></form></div>`:`<div class="callout warncall">Trình duyệt này chưa cấp quyền WebCrypto. Hãy mở file bằng Chrome/Edge; có thể cần môi trường bảo mật.</div>`}
 <div class="sectionbar"><h2>Kho ghi chú đã mã hóa</h2></div>${s.secureDocs.length?s.secureDocs.slice().reverse().map(d=>`<div class="card v2-case"><div class="flex" style="justify-content:space-between"><div><b>🔐 ${esc(d.title)}</b><span class="sub">Lô ${esc(d.lot)} • ${date(d.time)}</span></div><span class="tag blue">AES-256-GCM</span></div><p class="mono" style="max-width:100%;overflow-wrap:anywhere">Ciphertext (base64): ${esc(d.ciphertext.slice(0,125))}…</p><p class="note">Salt: ${esc(d.salt)} · IV: ${esc(d.iv)} · PBKDF2-SHA-256 ${d.iterations} vòng</p>${button('🔓 Giải mã (nhập mật khẩu)','v2decrypt',d.id,'primary')}${button('Kiểm tra sửa bản mã','v2tampercipher',d.id,'warn',may('inspector')?'':'disabled')}</div>`).join(''):'<div class="card panel">Chưa có tài liệu AES. Hãy tạo một ghi chú phía trên rồi thử giải mã.</div>'}
 <div class="callout warncall"><b>Lưu ý bảo mật:</b> Bản demo lưu ciphertext ở localStorage của trình duyệt; không lưu mật khẩu. Mật khẩu yếu có thể bị đoán. Mô hình thực cần quản lý khóa chuyên dụng, cơ chế khôi phục, xác thực người dùng và phân quyền backend thực sự.</div>`)}
const v2B64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const v2FromB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function v2Key(password,salt,iterations){const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function v2Encrypt(plaintext,password){if(!crypto?.subtle)throw Error('WebCrypto không hỗ trợ ở trình duyệt này.');if(password.length<8)throw Error('Mật khẩu phải có ít nhất 8 ký tự.');const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),iterations=210000;const key=await v2Key(password,salt,iterations);const encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(plaintext));return {algorithm:'AES-256-GCM',kdf:'PBKDF2-SHA-256',iterations,salt:v2B64(salt),iv:v2B64(iv),ciphertext:v2B64(encrypted)}}
async function v2Decrypt(e,password){const key=await v2Key(password,v2FromB64(e.salt),e.iterations);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:v2FromB64(e.iv)},key,v2FromB64(e.ciphertext));return new TextDecoder().decode(plain)}
function v2OpenDecrypt(id){const d=s.secureDocs.find(x=>x.id===id);if(!d)return;modal('Mở chứng từ AES '+id,'Mật khẩu không được lưu trong cơ sở dữ liệu hoặc localStorage.',`<form id="form-v2-decrypt"><input type="hidden" name="id" value="${esc(id)}"><div class="field"><label>Mật khẩu đã dùng khi mã hóa</label><input class="input" name="password" type="password" required autocomplete="off"></div><div id="v2-dec-result" class="note">Nhập mật khẩu rồi nhấn giải mã.</div>${foot('Giải mã')}</form>`)}
function v2Action(cmd,id){try{if(cmd==='v2camera')v2CameraScan().catch(e=>toast(e.message,true));else if(cmd==='v2stage')v2OpenStep(id);else if(cmd==='v2detail')v2Detail(id);else if(cmd==='v2tag')v2ViewTag(id);else if(cmd==='v2mint')v2MakePackage(id);else if(cmd==='v3download'){const p=s.packages.find(x=>x.code===id);if(!p)throw Error('Không tìm thấy mã.');const checked=v3CodeStatus(p);downloadFile('SafeMeal-'+p.code+'.json',JSON.stringify({notice:'DEMO offline - KHONG PHAI GIAY CHUNG NHAN PHAP LY',unifiedCode:p.code,lot:p.lot,valid:checked.valid,why:checked.why,combinedHash:p.combinedHash,stages:v2Stages(p.lot),handover:tr(p.lot)},null,2));}else if(cmd==='v2result')v2CaseResult(id);else if(cmd==='v2resolve')v2OpenResolve(id);else if(cmd==='v2decrypt')v2OpenDecrypt(id);else if(cmd==='v2tampercipher'){if(!may('inspector'))throw Error('Cần vai trò Ban kiểm định.');const d=s.secureDocs.find(x=>x.id===id);if(!d)throw Error('Không tìm thấy chứng từ.');let v=d.ciphertext;d.ciphertext=(v[0]==='A'?'B':'A')+v.slice(1);entry(s,'ENCRYPTED_EVIDENCE_TAMPER_DEMO',d.lot,actorId,{doc:id});save();render();toast('Đã đổi byte ciphertext, giải mã sẽ bị từ chối.')}else if(cmd==='v2complaintprefill'){page='complaints';$('#overlay').innerHTML='';render();const f=byId('v2-code');if(f){f.value=id;f.focus()}}else if(cmd==='v2resetnotice')toast('Dữ liệu thử 3 bước và AES sẽ được tạo lại khi khôi phục mẫu.');else if(cmd==='v2export'){downloadFile('SafeMeal-V2-bang-chung.json',JSON.stringify({demo:true,stages:s.stages,packages:s.packages,complaints:s.complaints,encryptedDocs:s.secureDocs,events:s.events},null,2))}else toast('Không nhận biết hành động.',true)}catch(e){console.error(e);toast(e.message||'Có lỗi khi xử lý.',true)}}
async function v2Submit(f){const d=Object.fromEntries(new FormData(f));try{
 if(f.id==='form-v2-stage'){
  const id=d.lot,step=+d.step;
  if(!lot(id)||!Number.isInteger(step)||step<1||step>3)throw Error('Phiếu không hợp lệ.');
  if(!may(STAGE_ROLES[step]))throw Error('Sai vai trò với bước kiểm định.');
  if(step>1&&!v2Approved(id,step-1))throw Error('Chưa hoàn thành bước trước.');
  if(v2Stages(id)[step-1]?.result==='pass')throw Error('Phiếu đã đạt không thể ghi đè.');
  if(step===2&&new Date(d.expiry)<new Date(d.date))throw Error('Hạn dùng phải sau ngày sản xuất.');
  if(step===3&&tr(id)?.status!=='accepted')throw Error('Phải nhận hàng ở điểm bán trước khi kiểm định bước 3.');
  if(step===3){const temp=Number(d.displayTemp);if(!Number.isFinite(temp)||temp < -40||temp>90)throw Error('Nhiệt độ đo không hợp lệ.');if(d.result==='pass'&&(d.seal!=='intact'||temp>lot(id).threshold))throw Error('Điểm bán không thể xác nhận ĐẠT nếu niêm phong hỏng hoặc nhiệt độ kiểm tra vượt ngưỡng.');}
  const meta={location:d.location,date:d.date,reference:d.reference};
  if(step===2)meta.expiry=d.expiry;
  if(step===3){meta.seal=d.seal;meta.displayTemp=d.displayTemp;}
  const r=v2SeedRecord(id,step,d.result,actorId,meta);
  if(step===3&&d.result==='pass'){
   const p=v3IssueCode(id,actorId);
   toast('Bước 3 đạt! ĐÃ CẤP 1 MÃ TỔNG HỢP: '+p.code);
  }else toast('Đã lưu phiếu SHA-256 bước '+step+'. Chưa cấp mã khi chưa đủ ba bước.');
  page='quality';
 }
 
else if(f.id==='form-v2-complaint'){const code=d.code.trim().toUpperCase();if(!code||d.description.trim().length<5)throw Error('Hãy nhập mã và nội dung phản ánh.');const result=v2GetCaseData(code,d.printedLot.trim(),d.printedProduct.trim(),d.seal);const c={id:'PA-'+String(s.complaints.length+1).padStart(3,'0'),code,printedLot:d.printedLot.trim(),printedProduct:d.printedProduct.trim(),seal:d.seal,description:d.description.trim(),lot:result.lot,kind:result.kind,label:result.label,details:result.desc,time:ts(),status:'open',review:null};s.complaints.push(c);entry(s,'QUALITY_COMPLAINT',c.lot||'UNKNOWN','public',{caseId:c.id,codeHash:hash(code),kind:c.kind});toast('Đã ghi phản ánh '+c.id);save();render();v2CaseResult(c.id);return}
 else if(f.id==='form-v2-resolve'){if(!may('inspector'))throw Error('Chỉ nhân viên kiểm định ghi nhận xử lý.');const c=s.complaints.find(x=>x.id===d.id);if(!c||c.status!=='open')throw Error('Phản ánh không hợp lệ.');if(d.action.trim().length<8)throw Error('Mô tả biện pháp xử lý chi tiết hơn.');c.status='reviewed';c.review={actor:actorId,time:ts(),decision:d.decision,action:d.action.trim()};entry(s,'QUALITY_REVIEW',c.lot||'UNKNOWN',actorId,{caseId:c.id,decision:d.decision,reviewHash:hash(d.action.trim())});toast('Đã lưu kết quả đánh giá trong bản mô phỏng.');page='complaints'}
 else if(f.id==='form-v2-secret'){if(!may('inspector'))throw Error('Chuyển sang vai trò Ban kiểm định để tạo ghi chú mật.');if(!crypto?.subtle)throw Error('Web Crypto API chưa hỗ trợ.');const e=await v2Encrypt(d.plaintext,d.password);const r={id:'AES-'+String(s.secureDocs.length+1).padStart(3,'0'),lot:d.lot,title:d.title.trim(),time:ts(),owner:actorId,...e};s.secureDocs.push(r);entry(s,'ENCRYPTED_EVIDENCE_ADDED',r.lot,actorId,{doc:r.id,cipherDigest:hash(r.ciphertext),algorithm:r.algorithm});toast('Đã mã hóa thật AES-256-GCM. Không lưu plaintext và mật khẩu.');page='security'}
 else if(f.id==='form-v2-decrypt'){const el=byId('v2-dec-result'),r=s.secureDocs.find(x=>x.id===d.id);if(!r)throw Error('Không tìm thấy chứng từ.');if(!may('inspector'))throw Error('Chỉ Ban kiểm định có quyền giao diện giải mã.');try{const msg=await v2Decrypt(r,d.password);el.innerHTML=`<div class="callout"><b>✓ Giải mã thành công bằng AES-256-GCM</b><p style="white-space:pre-wrap;word-break:break-word">${esc(msg)}</p></div>`}catch(e){el.innerHTML='<div class="callout warncall"><b>✕ Sai mật khẩu hoặc ciphertext đã bị thay đổi.</b> AES-GCM từ chối giải mã.</div>'}return}
 else return;
 save();$('#overlay').innerHTML='';render();
 }catch(e){console.error(e);toast(e.message||'Không lưu được.',true)}}
document.addEventListener('submit',e=>{if(!['form-v2-stage','form-v2-complaint','form-v2-resolve','form-v2-secret','form-v2-decrypt'].includes(e.target.id))return;e.preventDefault();v2Submit(e.target)})

v2Init();
render();
</script></body></html>
