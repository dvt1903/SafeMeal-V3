QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);

		for (var i = 0; i < dcdata[r].length; i++) {

	}

	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {

			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

};

async function verifyOffline(code){const lot=state.lots.find(l=>l.certificate?.code===code);if(!lot)return {registered:false,status:'unregistered',message:'Mã không nằm trong dữ liệu minh họa của trình duyệt hiện tại.'};const st=lot.inspections;if(!st.every(x=>x.digest))return {registered:true,status:'tampered',message:'Thiếu dấu kiểm định'};const expected=await sha(JSON.stringify({lotId:lot.id,stepHashes:st.map(x=>x.digest),accepted:lot.handoff?.accepted}));const checks=await Promise.all(st.map(i=>sha(JSON.stringify({lotId:lot.id,step:i.step,status:i.status,payload:i.payload,issuer:i.issuer_id,created:i.created}))));const integrity=expected===lot.certificate.root_hash&&st.every((x,i)=>x.digest===checks[i]);const status=integrity?evaluate(lot):'tampered';return {registered:true,status,certificate:lot.certificate,lot,steps:lot.inspections,expiry:st.find(s=>s.step===2)?.payload.expiry,meals:lot.meals,canSell:status==='valid',message:status==='valid'?'Ba hồ sơ khớp, sản phẩm chưa có cảnh báo.':status==='expired'?'Hồ sơ khớp nhưng đã hết hạn.':status==='held'?'Sản phẩm đã tạm giữ.':'Không thể xác minh tính toàn vẹn.'}}
async function verifyAny(code){if(!code)return null;return isApi?await api('/api/verify/'+encodeURIComponent(code)):await verifyOffline(code)}
async function api(path,method='GET',payload){const r=await fetch(path,{method,headers:{'Content-Type':'application/json',...(sessionToken?{Authorization:'Bearer '+sessionToken}:{})},body:payload?JSON.stringify(payload):undefined});let data=await r.json();if(!r.ok)throw Error(data.error||'Không kết nối API');return data}
async function load(){if(isApi){state={lots:await api('/api/lots'),complaints:[],secureDocs:[],audit:[]};if(sessionToken){try{user=await api('/api/me');role=user.role}catch{sessionToken='';sessionStorage.removeItem(KEYS.token)}}}else{try{const cached=JSON.parse(localStorage.getItem(KEYS.state)||'null');if(cached?.lots?.length&&cached.version===4)state=cached}catch{}if(!state)state={...(await offlineSeed()),version:4};}state.aiReports=state.aiReports||[];if(isApi){try{state.aiReports=await api('/api/ai-reports')}catch(e){console.warn('AI reports API:',e.message)}}if(verifyCode)verifyResult=await verifyAny(verifyCode);render()}
function save(){if(!isApi){try{localStorage.setItem(KEYS.state,JSON.stringify(state))}catch(e){console.warn('Storage error:',e);toast('Trình duyệt không lưu được dữ liệu. Bạn có thể thử tải lại sau khi giải phóng dung lượng.',true)}}}

function verifyCard(v){if(!v.registered)return `<div class="notice warn"><strong>Mã chưa đăng ký.</strong><p>${esc(v.message)}</p></div>`;return `<div class="userbubble"><div class="actions" style="justify-content:space-between">${badge(v.status)}<span class="pill">Mã lô ${esc(v.lot.id)}</span></div><h2 style="margin:16px 0 5px">${esc(v.lot.name)}</h2><p class="small">${esc(v.message)}</p><div class="detailgrid" style="margin-top:15px"><div><label>Vùng sản xuất</label><strong>${esc(v.lot.origin)}</strong></div><div><label>Hạn sử dụng</label><strong>${esc(v.expiry||'Chưa khai báo')}</strong></div><div><label>Dấu tổng hợp SHA-256</label><strong class="mono">${cut(v.certificate?.root_hash)}</strong></div><div><label>Cho phép lưu hành</label><strong>${v.canSell?'Có (theo dữ liệu đã nhập)':'Không'}</strong></div></div></div>`}
function qrDraw(){const box=$('#qrArea');if(!box||typeof SafeQR==='undefined')return;const url=location.origin+location.pathname+'?verify='+encodeURIComponent(verifyCode);const q=new SafeQR(-1,SafeQRLevel.M);q.addData(url);q.make();const n=q.getModuleCount(),pad=4,sz=n+pad*2;let rects=`<rect width="${sz}" height="${sz}" fill="#fff"/>`;for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))rects+=`<rect x="${x+pad}" y="${y+pad}" width="1" height="1" fill="#0a4c37"/>`;box.innerHTML=`<svg viewBox="0 0 ${sz} ${sz}" xmlns="http://www.w3.org/2000/svg" aria-label="Mã QR dẫn tới trang xác minh" role="img">${rects}</svg>`}

function inspectModal(id){const l=getLot(id),step=l.inspections.length+1;if(step>3)return toast('Đã đủ 3 bước.');if(role!==['','producer','factory','retailer'][step])return toast('Bước '+step+' cần vai trò '+names[['','producer','factory','retailer'][step]]+'. Hãy chọn vai trò ở phía trên.',true);modal('Ghi nhận bước '+step,`<form id="inspectForm"><input type="hidden" name="lot" value="${id}"/><input type="hidden" name="step" value="${step}"/><div class="formgrid">${field('location','Địa điểm kiểm định','text',step===1?l.origin:step===2?'Xưởng GreenFood':'Căng tin Đại học')}${step===2?field('expiry','Hạn sử dụng','date','2027-12-31'):step===3?field('temperature','Nhiệt độ đo (°C)','number','4','step="0.1" min="-40" max="90"'):field('notes','Mã biên bản','text','PK-2026-01')}</div>${step!==1?'<div class="field"><label>Ghi chú / chứng từ</label><input name="notes" value="Chứng từ kiểm định và đối chiếu đầy đủ" required/></div>':''}${step===3?'<div class="field"><label>Niêm phong</label><select name="seal"><option value="intact">Còn nguyên</option><option value="broken">Bị rách</option></select></div>':''}<div class="field"><label>Kết quả</label><select name="status"><option value="pass">Đạt</option><option value="fail">Không đạt</option></select></div><div class="modalactions">${btn('Hủy','close')}<button type="submit" class="btn primary">Lưu kiểm định</button></div></form>`,'Phiếu được gắn SHA-256; kiểm định bước 3 cần có báo cáo hỗ trợ AI về chuỗi lạnh (không thay xét nghiệm).');}

async function doInspect(f){const d=Object.fromEntries(new FormData(f));const id=d.lot,step=Number(d.step),l=getLot(id);if(step===3&&d.status==='pass'&&!(state.aiReports||[]).some(r=>r.lot===id&&r.stage===3))throw Error('Điểm bán phải ghi báo cáo phân tích AI/chuỗi lạnh cho lô trước khi xác nhận Đạt. Vào Phòng lab AI.');if(isApi){await api(`/api/lots/${id}/inspect/${step}`,'POST',d);state.lots=await api('/api/lots');}else{if(role!==['','producer','factory','retailer'][step])throw Error('Không đúng vai trò.');if(step>1&&!l.inspections.some(x=>x.step===step-1&&x.status==='pass'))throw Error('Chưa hoàn thành bước trước.');if(step===3&&!l.handoff)throw Error('Chưa nhận hàng ở điểm bán.');if(step===3&&d.status==='pass'&&(d.seal!=='intact'||Number(d.temperature)>l.threshold))throw Error('Điểm bán chưa đủ điều kiện đạt.');if(step===3&&d.status==='pass'&&l.inspections.find(x=>x.step===2)?.payload?.expiry<now().slice(0,10))throw Error('Hàng đã hết hạn sử dụng. Không được cấp mã SMKD.');if(step===3&&d.status==='pass'){const r=(state.aiReports||[]).filter(x=>x.lot===id&&x.stage===3).at(-1);if(r?.created&&l.handoff?.accepted&&r.created<l.handoff.accepted)throw Error('Báo cáo AI phải lập sau khi điểm bán nhận hàng.');if(r?.summary?.level==='review-required'&&!r.reviewed)throw Error('AI cảnh báo rủi ro cao. Cần Ban kiểm định xử lý trước; không cho tự đánh dấu Đạt.');}const record={step,status:d.status,created:now(),payload:{location:d.location,notes:d.notes,expiry:d.expiry,seal:d.seal,temperature:d.temperature},issuer_id:step};record.digest=await sha(JSON.stringify({lotId:id,step,status:d.status,payload:record.payload,issuer:step,created:record.created}));l.inspections.push(record);if(step===3&&d.status==='pass'){const root_hash=await sha(JSON.stringify({lotId:id,stepHashes:l.inspections.map(x=>x.digest),accepted:l.handoff.accepted}));l.certificate={code:`SMKD-${id}-${root_hash.slice(0,12).toUpperCase()}`,root_hash,issued:now()}}save()}
 closeModal();render();toast(step===3&&d.status==='pass'?'Đã hoàn thành và phát hành 1 mã SMKD.':'Đã ghi phiếu bước '+step)}
async function doHandoff(id){if(isApi){await api(`/api/lots/${id}/handoff`,'POST',{});state.lots=await api('/api/lots')}else{const l=getLot(id);if(role!=='retailer'||!l.inspections.some(x=>x.step===2&&x.status==='pass'))throw Error('Chỉ điểm bán sau bước 2 mới được nhận hàng.');if(l.handoff)throw Error('Đã nhận hàng.');l.handoff={accepted:now(),receiver_id:3};save()}render();toast('Điểm bán đã xác nhận nhận hàng.')}
async function doHold(id){const reason=prompt('Lý do tạm giữ lô '+id+' (tối thiểu 8 ký tự):','Phản ánh chất lượng cần kiểm tra');if(reason===null)return;if(reason.trim().length<8)throw Error('Lý do cần tối thiểu 8 ký tự.');if(isApi){await api(`/api/lots/${id}/hold`,'POST',{reason});state.lots=await api('/api/lots')}else{if(role!=='inspector')throw Error('Chỉ Ban kiểm định có quyền tạm giữ.');getLot(id).hold_reason=reason;save()}toast('Đã tạm giữ '+id);render()}
async function connectWallet(){if(!window.ethereum?.request){toast('Không phát hiện ví EVM. Cài MetaMask Extension rồi mở lại trang.',true);return}const arr=await window.ethereum.request({method:'eth_requestAccounts'});walletAddress=arr?.[0]||'';walletChain=await window.ethereum.request({method:'eth_chainId'});walletAddress?toast('Đã kết nối MetaMask thật: '+cut(walletAddress)):toast('Chưa cấp quyền truy cập ví.',true);render()}
async function signWallet(){if(!walletAddress)throw Error('Hãy kết nối ví trước.');const nonce=hex(crypto.getRandomValues(new Uint8Array(16)));const target=getLot(currentLot)?.certificate?getLot(currentLot):state.lots.find(l=>l.certificate);const msg=`SafeMeal V4 | Signed inspection acknowledgement\nWebsite: ${location.origin}\nWallet: ${walletAddress}\nLot: ${target?.id||"No certified lot"}\nSMKD: ${target?.certificate?.code||"Not yet issued"}\nSHA-256 root: ${target?.certificate?.root_hash||"Not yet issued"}\nNonce: ${nonce}\nTime: ${now()}\nThis is an OFF-CHAIN demo signature, not a blockchain transaction.`;const signature=await window.ethereum.request({method:'personal_sign',params:['0x'+hex(new TextEncoder().encode(msg)),walletAddress]});signed={message:msg,signature,address:walletAddress};render();toast('MetaMask đã tạo chữ ký. Chưa ghi Blockchain.');}
async function switchChain(){if(!window.ethereum)throw Error('Chưa kết nối ví.');await window.ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:'0xaa36a7'}]});walletChain=await window.ethereum.request({method:'eth_chainId'});render();toast('Đã chuyển sang Sepolia.')}
async function anchorOnchain(f){if(!walletAddress)throw Error('Chưa kết nối ví.');if(walletChain!=='0xaa36a7')throw Error('Chỉ ghi dấu trên Sepolia (0xaa36a7).');const d=Object.fromEntries(new FormData(f));if(!/^0x[0-9a-fA-F]{40}$/.test(d.contract))throw Error('Địa chỉ hợp đồng không hợp lệ.');const l=getLot(d.lot);if(!l?.certificate)throw Error('Lô chưa có mã.');const root=(l.certificate.root_hash||'').toLowerCase();if(!/^[0-9a-f]{64}$/.test(root))throw Error('Dấu SHA-256 không hợp lệ.');const calldata=abiBytes32Anchor(keccak256(l.id),'0x'+root);txHash=await window.ethereum.request({method:'eth_sendTransaction',params:[{from:walletAddress,to:d.contract,data:calldata}]});render();toast('Đã gửi tx Sepolia. Hãy kiểm tra Etherscan để biết đã xác nhận chưa.');}
const bytesToB64=b=>btoa(String.fromCharCode(...b)),b64ToBytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(password,salt){const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:210000,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptNote(f){const d=Object.fromEntries(new FormData(f));if(!crypto?.subtle)throw Error('WebCrypto không được hỗ trợ.');if(d.password.length<8)throw Error('Mật khẩu cần >=8 ký tự.');const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await derive(d.password,salt);const enc=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(d.text)));state.secureDocs.push({id:'AES-'+String(state.secureDocs.length+1).padStart(3,'0'),salt:bytesToB64(salt),iv:bytesToB64(iv),ciphertext:bytesToB64(enc)});save();render();toast('Đã mã hóa AES-256-GCM; mật khẩu không lưu lại.')}
async function decryptNote(id){const pass=prompt('Nhập mật khẩu đã dùng để giải mã:');if(pass===null)return;const obj=state.secureDocs.find(x=>x.id===id);try{const key=await derive(pass,b64ToBytes(obj.salt));const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(obj.iv)},key,b64ToBytes(obj.ciphertext));modal('Giải mã thành công',`<div class="notice" style="white-space:pre-wrap">${esc(new TextDecoder().decode(plain))}</div>${btn('Đóng','close','','primary')}`,'Thông tin đã được giải mã trong trình duyệt.')}catch{toast('Sai mật khẩu hoặc bản mã đã bị sửa.',true)}}

async function submit(f){try{if(f.id==='inspectForm')await doInspect(f);else if(f.id==='loginForm'){const d=Object.fromEntries(new FormData(f));const x=await api('/api/auth/login','POST',d);sessionToken=x.token;sessionStorage.setItem(KEYS.token,sessionToken);user=x.user;role=user.role;state.aiReports=await api('/api/ai-reports');closeModal();render();toast('Đăng nhập: '+user.name)}else if(f.id==='verifyForm'){const d=Object.fromEntries(new FormData(f));verifyCode=d.code.trim().toUpperCase();verifyResult=await verifyAny(verifyCode);const u=new URL(location.href);u.searchParams.set('verify',verifyCode);history.replaceState({},'',u);render()}else if(f.id==='complaintForm'){const d=Object.fromEntries(new FormData(f));if(isApi)complaintResult=await api('/api/complaints','POST',d);else{const v=await verifyAny(d.code.trim().toUpperCase());let classification=v.registered?v.status!=='valid'?v.status:d.printedLot&&d.printedLot.toUpperCase()!==v.lot.id?'mismatch':d.seal==='broken'?'seal-broken':'matched':'unregistered';complaintResult={id:state.complaints.length+1,classification,lotId:v.registered?v.lot.id:null,relatedMeals:v.meals||[],notice:'Không thể kết luận hàng giả chỉ từ QR. Cần kiểm tra mẫu và chứng từ.'};state.complaints.push({...complaintResult,code:d.code,created:now()});save()}render();toast('Đã tiếp nhận phản ánh và truy vết hồ sơ.')}else if(f.id==='anchorForm')await anchorOnchain(f);else if(f.id==='encryptForm')await encryptNote(f)}catch(e){console.error(e);toast(e.message||'Không thể lưu dữ liệu.',true)}}

<div class="card" style="margin-top:17px"><div class="actions" style="justify-content:space-between"><h2>Nhật ký hồ sơ AI của lô ${esc(l.id)}</h2>${btn('Tải hồ sơ JSON','aiexport','','',!(state.aiReports||[]).some(x=>x.lot===l.id))}</div><div class="rows">${(state.aiReports||[]).filter(x=>x.lot===l.id).slice().reverse().slice(0,6).map(x=>`<div class="item"><div><strong>${esc(x.created)} · ${esc(x.level)} · Bước ${x.stage}</strong><p>SHA-256: ${esc(cut(x.digest))} · Nguồn: ${esc(x.source?.label||x.source?.kind||'Chưa khai báo')}</p></div>${x.reviewed?badge('pass'):(role==='inspector'?btn('Xem xét hồ sơ AI','aireview',x.id,'primary'):'<span class="status gray">Chưa xem xét</span>')}</div>`).join('')||'<p class="muted">Chưa lưu báo cáo AI cho lô này.</p>'}</div></div>`)}
function aiSetText(){const a=$('#aiSeries'),n=$('#aiNarrative');if(a&&a.value!==aiSeries){aiSeries=a.value;aiSourceKind='manual';aiSourceNote='Chuỗi nhiệt độ được chỉnh sửa trực tiếp trong biểu mẫu';aiOutputs.cold=null}if(n&&n.value!==aiNarrative){aiNarrative=n.value;aiOutputs.nlp=null}}
async function aiLoadScript(url,key){if(window[key])return;await new Promise((resolve,reject)=>{const existing=[...document.scripts].find(x=>x.src===url);if(existing){existing.addEventListener('load',resolve,{once:true});existing.addEventListener('error',()=>reject(Error('Không tải được '+key)),{once:true});return}const sc=document.createElement('script');sc.src=url;sc.async=true;sc.onload=resolve;sc.onerror=()=>{sc.remove();reject(Error('Không tải được thư viện '+key+'. Hãy kiểm tra Internet rồi nhấn thử lại.'))};document.head.appendChild(sc)})}
async function aiModel(){if(netModel)return netModel;toast('Đang tải TensorFlow.js và MobileNet. Lần đầu cần Internet và có thể mất một lúc.');await aiLoadScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js','tf');await aiLoadScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js','mobilenet');if(!window.mobilenet)throw Error('MobileNet chưa sẵn sàng.');netModel=await window.mobilenet.load({version:2,alpha:1});return netModel}
async function aiImage(file){if(!file)throw Error('Hãy tải ảnh lên trước.');if(file.size>7*1024*1024)throw Error('Ảnh cần nhỏ hơn 7 MB.');return new Promise((ok,no)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(url);ok(img)};img.onerror=()=>{URL.revokeObjectURL(url);no(Error('Không đọc được ảnh.'))};img.src=url})}
async function aiImageDigest(file){return sha(new Uint8Array(await file.arrayBuffer()))}
async function aiDoAction(cmd,id){aiSetText();const l=getLot(aiLotId);
 if(cmd==='aiinspector'){if(isApi){loginModal()}else{role='inspector';localStorage.setItem(KEYS.actor,role);toast('Đã chọn Ban kiểm định mô phỏng.');aiLab()}return}
 if(cmd==='aireview'){if(role!=='inspector')throw Error('Chỉ Ban kiểm định được xác nhận xem xét.');const note=prompt('Nêu bằng chứng độc lập để xử lý cảnh báo AI (ít nhất 15 ký tự):','Đã kiểm tra mẫu thực tế và đối chiếu chứng từ tại quầy.');if(note===null)return;if(note.trim().length<15)throw Error('Cần giải thích quyết định tối thiểu 15 ký tự.');if(isApi){await api('/api/ai-reports/'+Number(id)+'/review','POST',{note});state.aiReports=await api('/api/ai-reports?lotId='+encodeURIComponent(aiLotId))}else{const r=(state.aiReports||[]).find(x=>x.digest===id);if(!r)throw Error('Không thấy báo cáo AI');r.reviewed=true;r.reviewNote=note.trim();save()}toast('Ban kiểm định đã ghi nhận xem xét bằng chứng.');aiLab();return}
 if(cmd==='aisample'){aiSeries=AI_SAMPLES[id]||AI_SAMPLES.alert;aiSourceKind='demo';aiSourceNote='Mẫu tích hợp: '+id;aiOutputs.cold=null;aiLab();return}
 if(cmd==='aiquick'){aiSeries=AI_SAMPLES.normal;aiSourceKind='demo';aiSourceNote='Kịch bản demo nhanh - nhiệt độ bình thường';aiNarrative='Lô hàng được kiểm tra tại điểm bán, tem còn nguyên và nhiệt độ bảo quản bình thường';aiOutputs={cold:analyzeColdChain(aiSeries,l.threshold),nlp:classifyText(aiNarrative),vision:null,ocr:null,similarity:null};aiLab();toast('Đã phân tích mẫu minh họa. Nhấn Lưu hồ sơ AI để tiếp tục kiểm định.');return}
 if(cmd==='aicold'){aiOutputs.cold=analyzeColdChain(aiSeries,l.threshold);aiLab();return}
 if(cmd==='ainlp'){aiOutputs.nlp=classifyText(aiNarrative);aiLab();return}
 if(cmd==='aivision'){const m=await aiModel();const im=await aiImage(aiFiles.sample);aiOutputs.vision=await m.classify(im,3);aiLab();return}
 if(cmd==='aicompare'){const m=await aiModel();const one=await aiImage(aiFiles.sample),two=await aiImage(aiFiles.reference);const t1=m.infer(one,true),t2=m.infer(two,true);try{const [a,b]=await Promise.all([t1.data(),t2.data()]);aiOutputs.similarity=visualSimilarity(a,b)}finally{t1.dispose();t2.dispose()}aiLab();return}
 if(cmd==='aiocr'){if(!aiFiles.sample)throw Error('Chọn ảnh sản phẩm trước khi chạy OCR.');toast('Đang tải và chạy OCR. Lần đầu cần Internet.');await aiLoadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js','Tesseract');let result;try{result=await window.Tesseract.recognize(aiFiles.sample,'vie+eng')}catch(e){toast('Gói OCR tiếng Việt chưa tải được, thử tiếng Anh.',true);result=await window.Tesseract.recognize(aiFiles.sample,'eng')}aiOutputs.ocr=ocrEvidence(result.data.text,l.id,l.name);aiLab();return}
 if(cmd==='aiexport'){const rows=(state.aiReports||[]).filter(x=>x.lot===l.id);if(!rows.length)throw Error('Chưa có báo cáo AI nào cho lô '+l.id);const payload=JSON.stringify({system:'SafeMeal V4.5',lot:l.id,exported:now(),notice:'Dữ liệu minh họa / bằng chứng chưa xác minh thực địa',reports:rows},null,2);const link=document.createElement('a');const url=URL.createObjectURL(new Blob([payload],{type:'application/json'}));link.href=url;link.download='SafeMeal-AI-'+l.id+'.json';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1200);toast('Đã xuất hồ sơ AI của '+l.id);return}
 if(cmd==='aisave'){const summary=aiSummary();if(summary.score==null)throw Error('Chạy phân tích trước khi lưu.');const stage=Math.min(3,l.inspections.length+1);if(stage===3&&!aiOutputs.cold)throw Error('Bước 3 bắt buộc phân tích dữ liệu cảm biến chuỗi lạnh trước khi lưu báo cáo AI.');const raw={lot:l.id,stage,created:now(),source:{kind:aiSourceKind,label:aiSourceNote,verifiedByIndependentSensor:false},cold:aiOutputs.cold?{count:aiOutputs.cold.count,values:aiOutputs.cold.values,threshold:aiOutputs.cold.threshold,exceed:aiOutputs.cold.exceed,method:aiOutputs.cold.method}:null,narrative:aiNarrative.slice(0,1200),nlp:aiOutputs.nlp?{label:aiOutputs.nlp.label,confidence:aiOutputs.nlp.confidence}:null,ocr:aiOutputs.ocr?{text:aiOutputs.ocr.text.slice(0,500),lotMatch:aiOutputs.ocr.lotMatch}:null,vision:aiOutputs.vision?{top:aiOutputs.vision.slice(0,2),similarity:aiOutputs.similarity}:null,summary:{level:summary.level,score:summary.score,lines:summary.lines}};
 const digest=await sha(JSON.stringify(raw)),r={...raw,digest};if(isApi){const saved=await api('/api/ai-reports','POST',{lotId:l.id,stage,series:aiSeries,sourceKind:aiSourceKind,sourceNote:aiSourceNote,narrative:aiNarrative,ocrText:aiOutputs.ocr?.text||'',visualSimilarity:aiOutputs.similarity});state.aiReports=await api('/api/ai-reports?lotId='+encodeURIComponent(l.id));toast('Đã gửi báo cáo AI đến máy chủ; chỉ số được tính lại trên API.');}else{state.aiReports=state.aiReports||[];state.aiReports.push(r);save();toast('Đã lưu báo cáo AI kèm SHA-256 trong trình duyệt.')}aiLab();return}
}
