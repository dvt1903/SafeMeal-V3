defs['QR8bitByte']=function(module,require){
var QRMode = require('./QRMode');

function QR8bitByte(data) {
	this.mode = QRMode.MODE_8BIT_BYTE;
	this.data = data;
}

QR8bitByte.prototype = {

	getLength : function() {
		return this.data.length;
	},
	
	write : function(buffer) {
		for (var i = 0; i < this.data.length; i++) {
			// not JIS ...
			buffer.put(this.data.charCodeAt(i), 8);
		}
	}
};

module.exports = QR8bitByte;

};
defs['QRBitBuffer']=function(module,require){
function QRBitBuffer() {
	this.buffer = [];
	this.length = 0;
}

QRBitBuffer.prototype = {

	get : function(index) {
		var bufIndex = Math.floor(index / 8);
		return ( (this.buffer[bufIndex] >>> (7 - index % 8) ) & 1) == 1;
	},
	
	put : function(num, length) {
		for (var i = 0; i < length; i++) {
			this.putBit( ( (num >>> (length - i - 1) ) & 1) == 1);
		}
	},
	
	getLengthInBits : function() {
		return this.length;
	},
	
	putBit : function(bit) {
	
		var bufIndex = Math.floor(this.length / 8);
		if (this.buffer.length <= bufIndex) {
			this.buffer.push(0);
		}
	
		if (bit) {
			this.buffer[bufIndex] |= (0x80 >>> (this.length % 8) );
		}
	
		this.length++;
	}
};

module.exports = QRBitBuffer;

defs['QRMath']=function(module,require){
var QRMath = {

	glog : function(n) {
	
		if (n < 1) {
			throw new Error("glog(" + n + ")");
		}
		
		return QRMath.LOG_TABLE[n];
	},
	
	gexp : function(n) {
	
		while (n < 0) {
			n += 255;
		}
	
		while (n >= 256) {
			n -= 255;
		}
	
		return QRMath.EXP_TABLE[n];
	},
	
	EXP_TABLE : new Array(256),
	
	LOG_TABLE : new Array(256)

};
	
for (var i = 0; i < 8; i++) {
	QRMath.EXP_TABLE[i] = 1 << i;
}
for (var i = 8; i < 256; i++) {
	QRMath.EXP_TABLE[i] = QRMath.EXP_TABLE[i - 4]
		^ QRMath.EXP_TABLE[i - 5]
		^ QRMath.EXP_TABLE[i - 6]
		^ QRMath.EXP_TABLE[i - 8];
}

	QRMath.LOG_TABLE[QRMath.EXP_TABLE[i] ] = i;
}

defs['QRPolynomial']=function(module,require){
var QRMath = require('./QRMath');

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}
}

QRPolynomial.prototype = {

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}
};

module.exports = QRPolynomial;

};

			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}

			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

function passports(){const certified=state.lots.filter(l=>l.certificate);const l=state.lots.find(x=>x.certificate?.code===verifyCode);shell(`${heading('DIGITAL PRODUCT PASSPORT','Hộ chiếu số & xác minh QR','Một mã SMKD mở lịch sử ba lần kiểm định. Xác thực hồ sơ được phân biệt với trạng thái lưu hành.')}
<div class="grid twocol"><div class="card"><h2>Nhập mã để xác minh</h2><form id="verifyForm"><div class="field"><label>Mã SMKD trên bao bì / QR</label><input name="code" value="${esc(verifyCode)}" placeholder="SMKD-L001-…" required/></div><div class="actions"><button class="btn primary" type="submit">▦ Xác minh ngay</button>${certified.length?btn('Dùng mã mẫu L001','samplecode'):''}</div></form>${verifyResult?`<div class="line"></div>${verifyCard(verifyResult)}`:'<div class="notice" style="margin-top:20px">Hãy nhập mã kiểm định. Với bản GitHub Pages, mã phát sinh trên một máy mới không tự đồng bộ sang thiết bị khác.</div>'}</div><div class="card"><h2>Mã đã cấp trong phiên này</h2><div class="rows">${certified.length?certified.map(x=>`<div class="item"><div><strong>${esc(x.id)} · ${esc(x.name)}</strong><p class="mono">${cut(x.certificate.code)}</p></div>${btn('Xem QR','openpassport',x.id,'')}</div>`).join(''):'<div class="empty">Chưa có mã. Hãy hoàn thiện 3 bước.</div>'}</div></div></div>${verifyResult?.registered?`<div class="grid twocol" style="margin-top:17px"><div class="card"><h2>Chuỗi ba nơi kiểm định</h2><div class="pipeline" style="grid-template-columns:1fr">${[1,2,3].map(n=>{const r=verifyResult.steps.find(x=>x.step===n);return `<div class="item"><div><strong>0${n} · ${steps[n]}</strong><p>Phiếu ${esc(cut(r?.digest))} · ${fmt(r?.created)}</p></div>${badge(r?.status||'pending')}</div>`}).join('')}</div></div><div class="card"><h2>Hộ chiếu & QR công khai</h2><div id="qrArea" class="qrpanel"></div><div class="code">${esc(verifyCode)}</div><p class="small muted" style="margin-top:15px">Mở trên điện thoại: ${btn('Sao chép liên kết','copyVerify',verifyCode)}</p><div class="notice warn">Dữ liệu từ GitHub Pages được lưu trong máy đang xem, không phải bản kiểm định dùng chung giữa các tổ chức. Mã QR giống nhau có thể bị sao chép lên hàng hóa khác.</div></div></div>`:''}`);if(verifyResult?.registered)qrDraw();}
function verifyCard(v){if(!v.registered)return `<div class="notice warn"><strong>Mã chưa đăng ký.</strong><p>${esc(v.message)}</p></div>`;return `<div class="userbubble"><div class="actions" style="justify-content:space-between">${badge(v.status)}<span class="pill">Mã lô ${esc(v.lot.id)}</span></div><h2 style="margin:16px 0 5px">${esc(v.lot.name)}</h2><p class="small">${esc(v.message)}</p><div class="detailgrid" style="margin-top:15px"><div><label>Vùng sản xuất</label><strong>${esc(v.lot.origin)}</strong></div><div><label>Hạn sử dụng</label><strong>${esc(v.expiry||'Chưa khai báo')}</strong></div><div><label>Dấu tổng hợp SHA-256</label><strong class="mono">${cut(v.certificate?.root_hash)}</strong></div><div><label>Cho phép lưu hành</label><strong>${v.canSell?'Có (theo dữ liệu đã nhập)':'Không'}</strong></div></div></div>`}
function qrDraw(){const box=$('#qrArea');if(!box||typeof SafeQR==='undefined')return;const url=location.origin+location.pathname+'?verify='+encodeURIComponent(verifyCode);const q=new SafeQR(-1,SafeQRLevel.M);q.addData(url);q.make();const n=q.getModuleCount(),pad=4,sz=n+pad*2;let rects=`<rect width="${sz}" height="${sz}" fill="#fff"/>`;for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))rects+=`<rect x="${x+pad}" y="${y+pad}" width="1" height="1" fill="#0a4c37"/>`;box.innerHTML=`<svg viewBox="0 0 ${sz} ${sz}" xmlns="http://www.w3.org/2000/svg" aria-label="Mã QR dẫn tới trang xác minh" role="img">${rects}</svg>`}

)','hold',complaintResult.lotId,'warn',role!=='inspector'):''}</div>`:''}

function inspectModal(id){const l=getLot(id),step=l.inspections.length+1;if(step>3)return toast('Đã đủ 3 bước.');if(role!==['','producer','factory','retailer'][step])return toast('Bước '+step+' cần vai trò '+names[['','producer','factory','retailer'][step]]+'. Hãy chọn vai trò ở phía trên.',true);modal('Ghi nhận bước '+step,`<form id="inspectForm"><input type="hidden" name="lot" value="${id}"/><input type="hidden" name="step" value="${step}"/><div class="formgrid">${field('location','Địa điểm kiểm định','text',step===1?l.origin:step===2?'Xưởng GreenFood':'Căng tin Đại học')}${step===2?field('expiry','Hạn sử dụng','date','2027-12-31'):step===3?field('temperature','Nhiệt độ đo (°C)','number','4','step="0.1" min="-40" max="90"'):field('notes','Mã biên bản','text','PK-2026-01')}</div>${step!==1?'<div class="field"><label>Ghi chú / chứng từ</label><input name="notes" value="Chứng từ kiểm định và đối chiếu đầy đủ" required/></div>':''}${step===3?'<div class="field"><label>Niêm phong</label><select name="seal"><option value="intact">Còn nguyên</option><option value="broken">Bị rách</option></select></div>':''}<div class="field"><label>Kết quả</label><select name="status"><option value="pass">Đạt</option><option value="fail">Không đạt</option></select></div><div class="modalactions">${btn('Hủy','close')}<button type="submit" class="btn primary">Lưu kiểm định</button></div></form>`,'Phiếu được gắn SHA-256; hoàn tất bước ba sẽ tự tạo một mã SMKD.');}
function loginModal(){modal('Đăng nhập vào backend SafeMeal',`<form id="loginForm"><div class="field"><label>Vai trò demo</label><select name="email">${[['farm@safemeal.demo','Nhà sản xuất'],['factory@safemeal.demo','Xưởng chế biến'],['store@safemeal.demo','Điểm bán'],['inspector@safemeal.demo','Ban kiểm định']].map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select></div>${field('password','Mật khẩu demo','password','SafeMeal@2026')}<div class="notice warn">Tài khoản mẫu chỉ dùng khi máy chủ chạy với DEMO_SEED=1. Không dùng mật khẩu mẫu trong sản phẩm thật.</div><div class="modalactions"><button class="btn primary" type="submit">Đăng nhập</button></div></form>`,'Kiểm tra quyền thực tế ở API Node.js + SQLite.');}
async function doInspect(f){const d=Object.fromEntries(new FormData(f));const id=d.lot,step=Number(d.step),l=getLot(id);if(isApi){await api(`/api/lots/${id}/inspect/${step}`,'POST',d);state.lots=await api('/api/lots');}else{if(role!==['','producer','factory','retailer'][step])throw Error('Không đúng vai trò.');if(step>1&&!l.inspections.some(x=>x.step===step-1&&x.status==='pass'))throw Error('Chưa hoàn thành bước trước.');if(step===3&&!l.handoff)throw Error('Chưa nhận hàng ở điểm bán.');if(step===3&&d.status==='pass'&&(d.seal!=='intact'||Number(d.temperature)>l.threshold))throw Error('Điểm bán chưa đủ điều kiện đạt.');const record={step,status:d.status,created:now(),payload:{location:d.location,notes:d.notes,expiry:d.expiry,seal:d.seal,temperature:d.temperature},issuer_id:step};record.digest=await sha(JSON.stringify({lotId:id,step,status:d.status,payload:record.payload,issuer:step,created:record.created}));l.inspections.push(record);if(step===3&&d.status==='pass'){const root_hash=await sha(JSON.stringify({lotId:id,stepHashes:l.inspections.map(x=>x.digest),accepted:l.handoff.accepted}));l.certificate={code:`SMKD-${id}-${root_hash.slice(0,12).toUpperCase()}`,root_hash,issued:now()}}save()}
 closeModal();render();toast(step===3&&d.status==='pass'?'Đã hoàn thành và phát hành 1 mã SMKD.':'Đã ghi phiếu bước '+step)}
async function doHandoff(id){if(isApi){await api(`/api/lots/${id}/handoff`,'POST',{});state.lots=await api('/api/lots')}else{const l=getLot(id);if(role!=='retailer'||!l.inspections.some(x=>x.step===2&&x.status==='pass'))throw Error('Chỉ điểm bán sau bước 2 mới được nhận hàng.');if(l.handoff)throw Error('Đã nhận hàng.');l.handoff={accepted:now(),receiver_id:3};save()}render();toast('Điểm bán đã xác nhận nhận hàng.')}
async function doHold(id){const reason=prompt('Lý do tạm giữ lô '+id+' (tối thiểu 8 ký tự):','Phản ánh chất lượng cần kiểm tra');if(reason===null)return;if(reason.trim().length<8)throw Error('Lý do cần tối thiểu 8 ký tự.');if(isApi){await api(`/api/lots/${id}/hold`,'POST',{reason});state.lots=await api('/api/lots')}else{if(role!=='inspector')throw Error('Chỉ Ban kiểm định có quyền tạm giữ.');getLot(id).hold_reason=reason;save()}toast('Đã tạm giữ '+id);render()}
async function connectWallet(){if(!window.ethereum?.request){toast('Không phát hiện ví EVM. Cài MetaMask Extension rồi mở lại trang.',true);return}const arr=await window.ethereum.request({method:'eth_requestAccounts'});walletAddress=arr?.[0]||'';walletChain=await window.ethereum.request({method:'eth_chainId'});walletAddress?toast('Đã kết nối MetaMask thật: '+cut(walletAddress)):toast('Chưa cấp quyền truy cập ví.',true);render()}
async function signWallet(){if(!walletAddress)throw Error('Hãy kết nối ví trước.');const nonce=hex(crypto.getRandomValues(new Uint8Array(16)));const target=getLot(currentLot)?.certificate?getLot(currentLot):state.lots.find(l=>l.certificate);const msg=`SafeMeal V4 | Signed inspection acknowledgement\nWebsite: ${location.origin}\nWallet: ${walletAddress}\nLot: ${target?.id||"No certified lot"}\nSMKD: ${target?.certificate?.code||"Not yet issued"}\nSHA-256 root: ${target?.certificate?.root_hash||"Not yet issued"}\nNonce: ${nonce}\nTime: ${now()}\nThis is an OFF-CHAIN demo signature, not a blockchain transaction.`;const signature=await window.ethereum.request({method:'personal_sign',params:['0x'+hex(new TextEncoder().encode(msg)),walletAddress]});signed={message:msg,signature,address:walletAddress};render();toast('MetaMask đã tạo chữ ký. Chưa ghi Blockchain.');}
async function switchChain(){if(!window.ethereum)throw Error('Chưa kết nối ví.');await window.ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:'0xaa36a7'}]});walletChain=await window.ethereum.request({method:'eth_chainId'});render();toast('Đã chuyển sang Sepolia.')}
async function anchorOnchain(f){if(!walletAddress)throw Error('Chưa kết nối ví.');if(walletChain!=='0xaa36a7')throw Error('Chỉ ghi dấu trên Sepolia (0xaa36a7).');const d=Object.fromEntries(new FormData(f));if(!/^0x[0-9a-fA-F]{40}$/.test(d.contract))throw Error('Địa chỉ hợp đồng không hợp lệ.');const l=getLot(d.lot);if(!l?.certificate)throw Error('Lô chưa có mã.');const root=(l.certificate.root_hash||'').toLowerCase();if(!/^[0-9a-f]{64}$/.test(root))throw Error('Dấu SHA-256 không hợp lệ.');const calldata=abiBytes32Anchor(keccak256(l.id),'0x'+root);txHash=await window.ethereum.request({method:'eth_sendTransaction',params:[{from:walletAddress,to:d.contract,data:calldata}]});render();toast('Đã gửi tx Sepolia. Hãy kiểm tra Etherscan để biết đã xác nhận chưa.');}
const bytesToB64=b=>btoa(String.fromCharCode(...b)),b64ToBytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(password,salt){const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:210000,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptNote(f){const d=Object.fromEntries(new FormData(f));if(!crypto?.subtle)throw Error('WebCrypto không được hỗ trợ.');if(d.password.length<8)throw Error('Mật khẩu cần >=8 ký tự.');const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await derive(d.password,salt);const enc=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(d.text)));state.secureDocs.push({id:'AES-'+String(state.secureDocs.length+1).padStart(3,'0'),salt:bytesToB64(salt),iv:bytesToB64(iv),ciphertext:bytesToB64(enc)});save();render();toast('Đã mã hóa AES-256-GCM; mật khẩu không lưu lại.')}
async function decryptNote(id){const pass=prompt('Nhập mật khẩu đã dùng để giải mã:');if(pass===null)return;const obj=state.secureDocs.find(x=>x.id===id);try{const key=await derive(pass,b64ToBytes(obj.salt));const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(obj.iv)},key,b64ToBytes(obj.ciphertext));modal('Giải mã thành công',`<div class="notice" style="white-space:pre-wrap">${esc(new TextDecoder().decode(plain))}</div>${btn('Đóng','close','','primary')}`,'Thông tin đã được giải mã trong trình duyệt.')}catch{toast('Sai mật khẩu hoặc bản mã đã bị sửa.',true)}}
async function act(el){const a=el.dataset.act,id=el.dataset.id||'';try{if(a==='close')closeModal();else if(a==='goto'){page=id;render()}else if(a==='reset'){if(confirm('Khôi phục dữ liệu demo? Các thao tác trong trình duyệt sẽ mất.')){localStorage.removeItem(KEYS.state);state={...(await offlineSeed()),version:4};verifyCode='';verifyResult=null;render();toast('Đã khôi phục dữ liệu mẫu.')}}else if(a==='lot'){currentLot=id;page='pipeline';render()}else if(a==='setrole'){if(isApi)loginModal();else{if(!names[id])throw Error('Vai trò không hợp lệ.');role=id;localStorage.setItem(KEYS.actor,role);render();toast('Đã chuyển sang '+names[id]+'. Bạn có thể ghi phiếu kiểm định.')}}else if(a==='inspect')inspectModal(id);else if(a==='handoff')await doHandoff(id);else if(a==='openpassport'){const l=getLot(id);verifyCode=l.certificate?.code||'';verifyResult=verifyCode?await verifyAny(verifyCode):null;page='passports';render()}else if(a==='samplecode'){verifyCode=state.lots[0].certificate?.code||'';verifyResult=await verifyAny(verifyCode);render()}else if(a==='copyVerify'){await navigator.clipboard.writeText(location.origin+location.pathname+'?verify='+encodeURIComponent(id));toast('Đã sao chép liên kết QR.')}else if(a==='hold')await doHold(id);else if(a==='walletconnect')await connectWallet();else if(a==='walletsign')await signWallet();else if(a==='switchchain')await switchChain();else if(a==='decrypt')await decryptNote(id);else if(a==='login')loginModal();}catch(e){console.error(e);toast(e.message||'Có lỗi xảy ra',true)}}
async function submit(f){try{if(f.id==='inspectForm')await doInspect(f);else if(f.id==='loginForm'){const d=Object.fromEntries(new FormData(f));const x=await api('/api/auth/login','POST',d);sessionToken=x.token;sessionStorage.setItem(KEYS.token,sessionToken);user=x.user;role=user.role;closeModal();render();toast('Đăng nhập: '+user.name)}else if(f.id==='verifyForm'){const d=Object.fromEntries(new FormData(f));verifyCode=d.code.trim().toUpperCase();verifyResult=await verifyAny(verifyCode);const u=new URL(location.href);u.searchParams.set('verify',verifyCode);history.replaceState({},'',u);render()}else if(f.id==='complaintForm'){const d=Object.fromEntries(new FormData(f));if(isApi)complaintResult=await api('/api/complaints','POST',d);else{const v=await verifyAny(d.code.trim().toUpperCase());let classification=v.registered?v.status!=='valid'?v.status:d.printedLot&&d.printedLot.toUpperCase()!==v.lot.id?'mismatch':d.seal==='broken'?'seal-broken':'matched':'unregistered';complaintResult={id:state.complaints.length+1,classification,lotId:v.registered?v.lot.id:null,relatedMeals:v.meals||[],notice:'Không thể kết luận hàng giả chỉ từ QR. Cần kiểm tra mẫu và chứng từ.'};state.complaints.push({...complaintResult,code:d.code,created:now()});save()}render();toast('Đã tiếp nhận phản ánh và truy vết hồ sơ.')}else if(f.id==='anchorForm')await anchorOnchain(f);else if(f.id==='encryptForm')await encryptNote(f)}catch(e){console.error(e);toast(e.message||'Không thể lưu dữ liệu.',true)}}
document.addEventListener('click',e=>{if(e.target.closest('[data-act]'))act(e.target.closest('[data-act]'));const navBtn=e.target.closest('[data-nav]');if(navBtn){page=navBtn.dataset.nav;render()}});
document.addEventListener('submit',e=>{if(['inspectForm','loginForm','verifyForm','complaintForm','anchorForm','encryptForm'].includes(e.target.id)){e.preventDefault();submit(e.target)}});
document.addEventListener('change',e=>{if(e.target.id==='roleSelect'){role=e.target.value;localStorage.setItem(KEYS.actor,role);render()}if(e.target.id==='lotSelect'){currentLot=e.target.value;render()}});
if(window.ethereum?.on){window.ethereum.on('accountsChanged',a=>{walletAddress=a?.[0]||'';signed=null;render()});window.ethereum.on('chainChanged',x=>{walletChain=x;render()})}
load().catch(e=>{console.error(e);$('#app').innerHTML=`<div style="padding:40px"><h2>Không mở được SafeMeal V4</h2><p>${esc(e.message)}</p><p>Hãy mở file trên HTTPS hoặc chạy bằng CHAY_SAFEMEAL_WINDOWS.bat để sử dụng đầy đủ.</p></div>`});

</script></body></html>
